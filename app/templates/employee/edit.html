{% extends 'base.html' %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
    <div>
        <h4 class="fw-bold text-dark mb-1"><i class="bi bi-pencil-square text-primary me-2"></i> Chỉnh Sửa Nhân Viên</h4>
        <small class="text-muted">Cập nhật thông tin chi tiết nhân sự</small>
    </div>
    <a href="/employee" class="btn btn-outline-secondary shadow-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Quay lại
    </a>
</div>

<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 p-md-5">
                
                {% if error %}
                <div class="alert alert-danger shadow-sm rounded-3">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
                </div>
                {% endif %}

                <form action="/employee/edit/{{ emp.id }}" method="POST" enctype="multipart/form-data">
                    
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Mã nhân viên</label>
                            <input type="text" class="form-control bg-light" value="{{ emp.code }}" disabled readonly>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Họ và tên <span class="text-danger">*</span></label>
                            <input type="text" name="fullname" class="form-control" value="{{ emp.fullname }}" required>
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Email <span class="text-danger">*</span></label>
                            <input type="email" name="email" class="form-control" value="{{ emp.email }}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Số điện thoại</label>
                            <input type="text" name="phone" class="form-control" value="{{ emp.phone or '' }}">
                        </div>
                    </div>

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Phòng ban</label>
                            <select name="department" class="form-select">
                                <option value="Quản lý" {% if emp.department == 'Quản lý' %}selected{% endif %}>Quản lý</option>
                                <option value="Kỹ Thuật" {% if emp.department == 'Kỹ Thuật' %}selected{% endif %}>Kỹ Thuật</option>
                                <option value="Bán hàng" {% if emp.department == 'Bán hàng' %}selected{% endif %}>Bán hàng</option>
                                <option value="Marketing" {% if emp.department == 'Marketing' %}selected{% endif %}>Marketing</option>
                                <option value="Giao Hoàng" {% if emp.department == 'Giao Hàng' %}selected{% endif %}>Giao Hàng</option>
                                <option value="Admin" {% if emp.department == 'Admin' %}selected{% endif %}>Admin</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Chức vụ</label>
                            <input type="text" name="position" class="form-control" value="{{ emp.position or '' }}">
                        </div>
                    </div>

                    <hr class="text-muted opacity-25 my-4">

                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Vai trò Hệ thống</label>
                            <select name="role" class="form-select">
                                <option value="employee" {% if emp.role == 'employee' %}selected{% endif %}>Nhân viên thường</option>
                                <option value="admin" {% if emp.role == 'admin' %}selected{% endif %}>Quản trị viên (Admin)</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-semibold text-secondary small">Mật khẩu mới (Tùy chọn)</label>
                            <input type="password" name="password" class="form-control" placeholder="Để trống nếu không đổi">
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-semibold text-secondary small">Cập nhật Avatar</label>
                        <div class="d-flex align-items-center gap-3">
                            {% if emp.avatar %}
                                <img src="{{ url_for('static', filename='uploads/avatars/' + emp.avatar) }}" class="rounded-circle border shadow-sm" style="width: 50px; height: 50px; object-fit: cover;">
                            {% else %}
                                <div class="bg-light border rounded-circle d-flex align-items-center justify-content-center" style="width: 50px; height: 50px;">
                                    <i class="bi bi-person text-muted fs-4"></i>
                                </div>
                            {% endif %}
                            <input type="file" name="avatar" class="form-control form-control-sm" accept="image/*">
                        </div>
                    </div>

                    <div class="d-grid mt-5">
                        <button type="submit" class="btn btn-primary py-2 fw-bold rounded-pill shadow-sm">
                            <i class="bi bi-save me-1"></i> Lưu Thay Đổi
                        </button>
                    </div>

                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
